# Place in /etc/nginx/conf.d/ledger.conf (inside nginx's http context).
# Replace ledger.example.com and certificate paths before enabling.
limit_req_zone $binary_remote_addr zone=ledger_ip:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=ledger_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=ledger_connections:10m;
server {
    listen 80;
    server_name ledger.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name ledger.example.com;
    ssl_certificate /etc/letsencrypt/live/ledger.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ledger.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 500k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn ledger_connections 10;
    limit_req_status 429;
    # Avoid storing OAuth codes in access logs.
    access_log off;
    location /auth/ {
        limit_req zone=ledger_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location /api/ {
        limit_req zone=ledger_ip burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}
