AWSTemplateFormatVersion: '2010-09-09'
Description: Optional least-privilege Ledger operations resources; attach output profile to existing EC2 separately.
Parameters:
  InstanceId:
    Type: AWS::EC2::Instance::Id
    Description: Existing Ledger instance
  DatabaseIdentifier:
    Type: String
    Default: ledger-db
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9-]*'
  CognitoPoolId:
    Type: String
    Description: Existing user pool in this region
    AllowedPattern: '[a-z0-9-]+_[a-zA-Z0-9]+'
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional email destination; recipient must confirm subscription
Conditions:
  HasEmail: !Not [!Equals [!Ref AlertEmail, '']]
Resources:
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: LedgerBackupRetention
            Status: Enabled
            Prefix: ledger/
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt BackupBucket.Arn
              - !Sub '${BackupBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
  Alerts:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Ledger operations alerts
  EmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail
      TopicArn: !Ref Alerts
  ApplicationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LedgerRestrictedOperations
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminDeleteUser
                Resource: !Sub 'arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoPoolId}'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub '${BackupBucket.Arn}/ledger/*'
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref Alerts
  ApplicationProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ApplicationRole
  InstanceHealthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Ledger EC2 status checks failing
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref InstanceId
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref Alerts
  DatabaseStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Ledger RDS has less than two GiB storage free
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DatabaseIdentifier
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref Alerts
Outputs:
  InstanceProfile:
    Value: !Ref ApplicationProfile
  BackupBucketName:
    Value: !Ref BackupBucket
  AlertTopicArn:
    Value: !Ref Alerts
