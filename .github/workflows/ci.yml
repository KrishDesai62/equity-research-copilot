name: Local research checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-local.lock
            requirements-filing-text.lock
      - run: python -m pip install -r requirements-filing-text.lock
      - run: python -m pytest -q
      - run: python -m compileall -q src
      - run: cfn-lint infra/aws/cache.yaml infra/aws/monitor.yaml infra/aws/status.yaml
      - run: git diff --check
